services:
  # 1. AI Microservice (Python 3.11 + FastAPI + PyMuPDF + Groq LLM + SentenceTransformers)
  - type: web
    name: resumix-ai-service
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: apps/ai-service
    plan: free
    region: singapore # or oregon / frankfurt
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: PORT
        value: "8000"
      - key: LLM_API_KEY
        sync: false

  # 2. Core API & Worker (Node.js 20 + Express + BullMQ Queue Worker)
  - type: web
    name: resumix-core-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore # or oregon / frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: resumix-ai-service
          property: url
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_PREFIX
        value: rag_cv
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: resumix-cv-bucket
